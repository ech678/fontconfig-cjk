<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>

  <!-- ============================================================ -->
  <!-- 1. 渲染参数 (27寸 2K 108.79 PPI, 100% 缩放优化)                  -->
  <!-- ============================================================ -->

  <!-- 抗锯齿 -->
  <match target="font">
    <edit name="antialias" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- RGB 次像素渲染 (匹配 2K LCD 物理面板) -->
  <match target="font">
    <edit name="rgba" mode="assign">
      <const>rgb</const>
    </edit>
  </match>

  <!-- 轻微微调 (锁定垂直与水平基线，保持矢量字形不变形) -->
  <match target="font">
    <edit name="hinting" mode="assign">
      <bool>true</bool>
    </edit>
    <edit name="hintstyle" mode="assign">
      <const>hintslight</const>
    </edit>
  </match>

  <!-- 禁用自动微调，使用 FreeType 40 现代化解释器 -->
  <match target="font">
    <edit name="autohint" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <!-- 禁用普通字体的点阵内嵌，保留 Noto Color Emoji 点阵 -->
  <match target="font">
    <test qual="any" name="family" compare="not_eq">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="embeddedbitmap" mode="assign">
      <bool>false</bool>
    </edit>
  </match>

  <match target="font">
    <test qual="any" name="family">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="embeddedbitmap" mode="assign">
      <bool>true</bool>
    </edit>
  </match>

  <!-- LCD 滤镜 (消除边缘彩边) -->
  <match target="font">
    <edit name="lcdfilter" mode="assign">
      <const>lcddefault</const>
    </edit>
  </match>


  <!-- ============================================================ -->
  <!-- 1b. Regular→Medium 字重补偿 (109 PPI 低分屏防笔画过细)       -->
  <!-- 仅当应用请求的字重恰好是 Regular(80) 时提升为 Medium(100)     -->
  <!-- Bold、Light 等其他字重不受影响                                -->
  <!-- ============================================================ -->

  <match target="font">
    <test name="family" compare="contains">
      <string>Noto Sans</string>
    </test>
    <test name="weight" compare="eq">
      <double>80</double>
    </test>
    <edit name="weight" mode="assign">
      <double>100</double>
    </edit>
  </match>

  <match target="font">
    <test name="family" compare="contains">
      <string>Noto Serif</string>
    </test>
    <test name="weight" compare="eq">
      <double>80</double>
    </test>
    <edit name="weight" mode="assign">
      <double>100</double>
    </edit>
  </match>


  <!-- ============================================================ -->
  <!-- 2. 默认字体优先级                                             -->
  <!-- ============================================================ -->

  <!-- Sans-Serif (无衬线/UI 界面) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Serif (衬线/排版阅读) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>serif</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- Monospace (等宽/代码终端) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>monospace</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>JetBrains Mono</string>
      <string>Noto Sans Mono</string>
      <string>Noto Sans Mono CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <!-- system-ui (浏览器与 Electron 现代前端界面) -->
  <match target="pattern">
    <test qual="any" name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>

  <match target="pattern">
    <test qual="any" name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
      <string>Noto Color Emoji</string>
    </edit>
  </match>


  <!-- ============================================================ -->
  <!-- 3. CJK 语言环境锁定 (防止异形字，强制 zh-CN 优先)               -->
  <!-- ============================================================ -->

  <match target="pattern">
    <test name="lang">
      <string>zh-cn</string>
    </test>
    <test qual="any" name="family">
      <string>Noto Sans CJK</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang">
      <string>zh-cn</string>
    </test>
    <test qual="any" name="family">
      <string>Noto Serif CJK</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>


  <!-- ============================================================ -->
  <!-- 4. Windows / macOS / Web 字体映射替换                         -->
  <!-- ============================================================ -->

  <!-- 西文字体映射至 Noto Sans / Noto Serif -->
  <match target="pattern">
    <test qual="any" name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Helvetica Neue</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Segoe UI</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Tahoma</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Verdana</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans</string>
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif</string>
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- 中文黑体映射至 Noto Sans CJK SC -->
  <match target="pattern">
    <test qual="any" name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>黑体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>

  <!-- 中文宋体映射至 Noto Serif CJK SC -->
  <match target="pattern">
    <test qual="any" name="family"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>新宋体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- 楷体映射至已安装的 LXGW WenKai Mono / LXGW WenKai (霞鹜文楷) -->
  <match target="pattern">
    <test qual="any" name="family"><string>KaiTi</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
      <string>LXGW WenKai</string>
    </edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>楷体</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>LXGW WenKai Mono</string>
      <string>LXGW WenKai</string>
    </edit>
  </match>

  <!-- 用户本地字体目录 -->
  <dir>~/.local/share/fonts</dir>
</fontconfig>
